<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DocuMate RAG AI</title>


    <!-- ============================= -->
    <!-- CSS -->
    <!-- ============================= -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            min-height: 100vh;

            padding: 30px;
        }


        .container {

            max-width: 900px;

            margin: auto;
        }


        /* HEADER */

        .header {

            background: white;

            padding: 30px;

            border-radius: 18px;

            text-align: center;

            margin-bottom: 20px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }


        .header h1 {

            color: #4f46e5;

            margin-bottom: 10px;

            font-size: 30px;
        }


        .header p {

            color: #64748b;

            line-height: 1.6;

            font-size: 15px;
        }


        /* UPLOAD BOX */

        .upload-box {

            background: white;

            padding: 25px;

            border-radius: 18px;

            margin-bottom: 20px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }


        .upload-box h2 {

            margin-bottom: 15px;

            color: #1e293b;
        }


        input[type="file"] {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: #f8fafc;
        }


        button {

            background: #4f46e5;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;
        }


        button:hover {

            background: #3730a3;

            transform: translateY(-1px);
        }


        .status {

            margin-top: 15px;

            color: #475569;

            line-height: 1.5;
        }


        /* CHAT BOX */

        .chat-box {

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }


        /* MESSAGES */

        .messages {

            height: 450px;

            overflow-y: auto;

            padding: 20px;

            display: flex;

            flex-direction: column;

            gap: 12px;

            background: #ffffff;
        }


        .user-message {

            background: #4f46e5;

            color: white;

            padding: 12px 16px;

            border-radius:
                15px
                15px
                3px
                15px;

            max-width: 75%;

            align-self: flex-end;

            line-height: 1.5;

            white-space: pre-wrap;
        }


        .bot-message {

            background: #f1f5f9;

            color: #1e293b;

            padding: 12px 16px;

            border-radius:
                15px
                15px
                15px
                3px;

            max-width: 80%;

            align-self: flex-start;

            line-height: 1.6;

            white-space: pre-wrap;
        }


        /* INPUT AREA */

        .input-area {

            display: flex;

            gap: 10px;

            padding: 15px;

            border-top:
                1px solid
                #e2e8f0;

            background: white;
        }


        .input-area input {

            flex: 1;

            padding: 13px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }


        .input-area input:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 2px
                rgba(79, 70, 229, 0.1);
        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .header {

                padding: 20px;
            }


            .header h1 {

                font-size: 24px;
            }


            .messages {

                height: 400px;
            }


            .user-message,
            .bot-message {

                max-width: 90%;
            }


            .input-area {

                flex-direction: column;
            }


            .input-area button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="header">

        <h1>
            📚 DocuMate RAG AI
        </h1>

        <p>
            Upload a PDF and ask questions
            based only on the uploaded document.
        </p>

    </div>


    <!-- ============================= -->
    <!-- PDF UPLOAD -->
    <!-- ============================= -->

    <div class="upload-box">

        <h2>
            📄 Upload PDF
        </h2>


        <input
            type="file"
            id="pdfFile"
            accept=".pdf"
        >


        <button
            onclick="uploadPDF()"
        >
            Upload PDF
        </button>


        <p
            id="uploadStatus"
            class="status"
        ></p>

    </div>


    <!-- ============================= -->
    <!-- CHAT -->
    <!-- ============================= -->

    <div class="chat-box">


        <div
            id="chatMessages"
            class="messages"
        >

            <div class="bot-message">

                👋 Hello!

                <br><br>

                Please upload a PDF first.

                <br><br>

                After uploading, you can ask
                questions about the PDF.

                <br><br>

                📌 I will answer only from
                the uploaded PDF.

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask a question from the PDF..."
                onkeypress="handleEnter(event)"
            >


            <button
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>


</div>



<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script>


// =====================================================
// UPLOAD PDF
// =====================================================

async function uploadPDF() {

    const fileInput =
        document.getElementById(
            "pdfFile"
        );


    const status =
        document.getElementById(
            "uploadStatus"
        );


    if (!fileInput.files.length) {

        status.innerText =
            "⚠️ Please select a PDF file.";

        return;
    }


    const file =
        fileInput.files[0];


    if (
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ) {

        status.innerText =
            "❌ Only PDF files are allowed.";

        return;
    }


    const formData =
        new FormData();


    formData.append(
        "document",
        file
    );


    status.innerText =
        "⏳ Processing PDF... Please wait.";


    try {

        const response =
            await fetch(
                "/upload",
                {
                    method: "POST",

                    body: formData
                }
            );


        const data =
            await response.json();


        if (data.success) {

            status.innerText =
                "✅ " + data.message;


            addBotMessage(
                "📄 PDF uploaded successfully.\n\nYou can now ask questions from this document."
            );

        }

        else {

            status.innerText =
                "❌ " + data.message;

        }

    }

    catch (error) {

        console.error(error);


        status.innerText =
            "❌ Could not connect to server.";

    }

}



// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    // Show user message

    addUserMessage(
        message
    );


    // Clear input

    input.value = "";


    // Loading message

    addBotMessage(
        "⏳ Searching the uploaded PDF..."
    );


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify(
                        {
                            message:
                                message
                        }
                    )
                }
            );


        const data =
            await response.json();


        // Remove loading message

        removeLastBotMessage();


        // Show answer

        addBotMessage(
            data.answer
        );

    }

    catch (error) {

        console.error(error);


        removeLastBotMessage();


        addBotMessage(
            "❌ Sorry, an error occurred. Please try again."
        );

    }

}



// =====================================================
// ADD USER MESSAGE
// =====================================================

function addUserMessage(
    message
) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "user-message";


    div.innerText =
        message;


    messages.appendChild(
        div
    );


    scrollToBottom();

}



// =====================================================
// ADD BOT MESSAGE
// =====================================================

function addBotMessage(
    message
) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "bot-message";


    div.innerText =
        message;


    messages.appendChild(
        div
    );


    scrollToBottom();

}



// =====================================================
// REMOVE LAST BOT MESSAGE
// =====================================================

function removeLastBotMessage() {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    const botMessages =
        messages.querySelectorAll(
            ".bot-message"
        );


    if (
        botMessages.length > 0
    ) {

        botMessages[
            botMessages.length - 1
        ].remove();

    }

}



// =====================================================
// ENTER KEY
// =====================================================

function handleEnter(
    event
) {

    if (
        event.key === "Enter"
    ) {

        sendMessage();

    }

}



// =====================================================
// SCROLL TO BOTTOM
// =====================================================

function scrollToBottom() {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    messages.scrollTop =
        messages.scrollHeight;

}


</script>


</body>

</html>
